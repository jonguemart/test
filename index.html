<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Futur SAAS</title>
  <style>
    :root {
      --blue: #0066ff;
      --cyan: #00ffff;
      --bg: #1e1e1e;
      --text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(0, 102, 255, 0.25), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.12), transparent 40%),
        var(--bg);
    }

    main {
      max-width: 640px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 20px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      font-size: 1.15rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 36px;
    }

    .btn {
      display: inline-block;
      padding: 16px 40px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      background: var(--blue);
      border: 2px solid var(--blue);
      border-radius: 999px;
      box-shadow: 0 0 24px rgba(0, 102, 255, 0.5);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-3px);
      border-color: var(--cyan);
      box-shadow: 0 0 32px rgba(0, 255, 255, 0.6);
    }
  </style>
</head>
<body>
  <main>
    <h1>Mon Futur SAAS</h1>
    <p>
      Une solution simple et puissante pour faire gagner du temps à votre
      équipe et faire grandir votre activité. Lancement très bientôt.
    </p>
    <a class="btn" href="#">Être prévenu du lancement</a>
  </main>
</body>
</html>
